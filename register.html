<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Student Portal</title>

    <!-- external css -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- navigation bar -->
    <header class="navbar">
      <span class="brand">Student Portal</span>
      <nav>
        <a href="index.html">Home</a>
        <a href="register.html" class="active">Register</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main class="container">
      <div class="card">
        <h1>Create an Account</h1>
        <p class="subtitle">Fill in the form to register.</p>

        <!-- errors or success message will show here (from js) -->
        <div id="message"></div>

        <form id="registerForm" novalidate>
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Maricar Padre" />

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="maricar@email.com" />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
          />

          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Type your password again"
          />

          <button type="submit" class="btn full">Register</button>
        </form>

        <p class="small-text">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </main>

    <!-- external js files (storage.js must be first because the others use it) -->
    <script src="js/storage.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
